pluginManagement {
	repositories {
		maven { url 'https://maven.fabricmc.net/' }
		gradlePluginPortal()
	}
	resolutionStrategy {
		eachPlugin {
			if (requested.id.id == 'net.fabricmc.fabric-loom' && requested.version.endsWith('-SNAPSHOT')) {
				useModule("net.fabricmc:fabric-loom:${requested.version}")
			}
		}
	}
}

rootProject.name = 'VibePlayer'
